spring.application.name=gateway-service
server.port=8084

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway routes
spring.cloud.gateway.server.webmvc.routes[0].id=order-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://inventory-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webmvc.routes[2].id=robot-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://robot-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/robots/**

spring.cloud.gateway.server.webmvc.routes[3].id=task-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://robot-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/tasks/**

spring.cloud.gateway.server.webmvc.routes[4].id=orchestrator-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://orchestrator-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/orchestrator/**

# Actuator
management.endpoints.web.exposure.include=health,info,gateway